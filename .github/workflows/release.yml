name: release

on:
  push:
    tags: ["v*"]
  # Pushing more than three tags at once makes GitHub drop the later tag
  # events, and a release can fail for reasons that have nothing to do
  # with the tag, so this can also be run by hand against one.
  workflow_dispatch:

# Read by default; the release job raises only what it needs.
permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      # Keyless signing and build provenance both prove who built the
      # artifacts, and both need an OIDC token to do it.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go test ./...
      # A SHA pins the action and never the tool the action installs.
      # Both of these fetch a binary, so both need the tool pinned beside
      # them: an unpinned tool is an unpinned build dependency wearing a
      # pinned wrapper.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          syft-version: v1.51.1
      - name: Release notes from the CHANGELOG
        env:
          REF_NAME: ${{ github.ref_name }}
        run: go run ./scripts/gates release-notes "${REF_NAME}" > "${RUNNER_TEMP}/release-notes.md"
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          # Exact, not "~> v2", and not "~> v2.18.1" either: a `~>` value
          # is a constraint whatever follows it, so narrowing one changes
          # the width of the range and not its kind. This is the tool
          # that decides what the artifacts are.
          version: "v2.18.1"
          args: release --clean --release-notes=${{ runner.temp }}/release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Provenance ties every published archive to this workflow, this
      # commit and this runner, checkable with `gh attestation verify`.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          # The bundle is a subject in its own right. It was covered only
          # through its row in checksums.txt, which is a claim about the
          # checksum file rather than about the bundle: `gh attestation
          # verify` on the .mcpb answered 404 while every archive passed.
          # The bundle is what most people actually install.
          subject-path: "dist/*.tar.gz,dist/*.zip,dist/*.mcpb,dist/checksums.txt"

  # The registry entry, last because the registry sends a HEAD to the
  # bundle's download URL before it accepts one: the release has to exist
  # first. Its own workflow so it can be re-run without cutting another
  # release, and so it runs with nothing but the token it needs.
  #
  # A prerelease rehearses the pipeline and must NOT rehearse the
  # registry: an entry cannot be taken back, so v1.0.0-rc1 would leave a
  # permanent row pointing at a bundle nobody should install.
  registry:
    needs: goreleaser
    if: ${{ !contains(github.ref_name, '-') }}
    uses: ./.github/workflows/publish-mcp.yml
    with:
      tag: ${{ github.ref_name }}
    permissions:
      id-token: write
      contents: read
